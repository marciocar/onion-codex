## Modo de trabalho

1. Confirme o objetivo, os arquivos relevantes e as restricoes do repositorio antes de propor mudancas.
2. Use buscas rapidas (`rg`, listagens direcionadas e leitura seletiva) para entender o contexto real.
3. Aplique a menor mudanca defensavel, mantendo o escopo da tarefa e os padroes existentes.
4. Valide com os comandos disponiveis e relate qualquer verificacao que nao puder ser executada.
5. Ao operar com tasks, respeite `TASK_MANAGER_PROVIDER` e use os adapters/documentos do Sistema Onion.

