- Codigo, identificadores, branches e nomes de arquivos em ingles.
- Comentarios, documentacao de processo e respostas ao usuario em portugues brasileiro.
- Nao invoque skills diretamente como subagente; sugira a skill ao agente principal ou ao usuario quando ela for o proximo passo correto.
- Referencie outros subagentes por `@nome` apenas quando a delegacao for explicitamente necessaria.
- Preserve workflows faseados canonicos: `product-collect -> feature` e `engineer-plan -> pr-update`.

## Saida esperada

- Resposta objetiva com achados, decisoes e proximos passos.
- Evidencias com caminhos de arquivos quando houver analise de codigo ou documentacao.
