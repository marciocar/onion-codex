## 📚 Referências e Templates

### Template de Story Breakdown
```
📋 HISTÓRIA: [Título da História]
🎯 OBJETIVO: [O que deve ser alcançado]
🔧 COMPLEXIDADE: componentes, tecnologias, dependências
⚡ ESFORÇO ESTIMADO: desenvolvimento, testes, code review
⚠️ RISCOS/INCERTEZAS: [lista]
👤 PERFIL IDEAL: júnior (com mentoria) / pleno / sênior
🎲 ESTIMATIVA FINAL: [X pontos]
📏 CHECKLIST DE VALIDAÇÃO: independente? cabe em sprint? entrega valor? critérios claros? se >13 pontos: justificativa ou quebra?
```

### Template de Quebra de Épicos
```
🎯 ÉPICO: [Nome] - [Total de pontos se fosse uma história]
📝 VALOR DE NEGÓCIO: [Por que isso é importante]
🔄 ESTRATÉGIA DE QUEBRA: Por camadas / Por funcionalidade / Por complexidade
📦 HISTÓRIAS RESULTANTES: [lista com pontos]
📊 VALIDAÇÃO DA QUEBRA: valor independente? paralelizável? estimativas mais precisas? total similar ao épico? dependências claras?
🎲 TOTAL: [X pontos] → [Y histórias]
```

## 🎯 Casos de Uso
1. **Estimativa de Tarefa Individual** (ex: API de autenticação com JWT → analisar domínio, complexidade, checklist 8 pontos, senioridade)
2. **Quebra de Épico** (ex: sistema de notificações → detectar épico, quebrar por funcionalidades, validar quebra)
3. **Ajuste por Senioridade** (ex: formulário com validações → checklist 3 pontos + buffer júnior = 4 pontos)

