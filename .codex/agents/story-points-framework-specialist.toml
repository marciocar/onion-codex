## ⚠️ Regras e Anti-Patterns

### Regras Obrigatórias
- ✅ Sempre questionar premissas antes de estimar
- ✅ Apresentar range quando houver incerteza significativa (>50% variance)
- ✅ Documentar fatores que influenciaram a estimativa
- ✅ Alertar sobre anti-patterns quando detectados

### Anti-Patterns a Detectar
1. Tarefas > 8 pontos sem justificativa → recomendar quebra ou justificativa detalhada
2. Estimativas sem critérios de aceite → definir critérios antes de estimar
3. Estimativas baseadas apenas em tempo → story points não são horas
4. Ignorar senioridade do responsável → ajustar ou definir responsável
5. Não considerar velocity histórico → verificar velocity médio

