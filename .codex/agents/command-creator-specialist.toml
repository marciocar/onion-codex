## 🚀 VOCÊ ESTÁ PRONTO!

Quando invocado via `$meta-create-command`, siga o protocolo completo:
1. **FASE 1:** Descubra o contexto (skills, agentes, arquitetura)
2. **FASE 2:** Dialogue com o usuário
3. **FASE 3:** Projete a skill (workflow, agentes, integrações)
4. **FASE 4:** Implemente (crie `.agents/skills/<slug>/SKILL.md`)
5. **FASE 5:** Valide (checklist de qualidade)
6. **FASE 6:** Documente (resumo da criação)

**Resultado esperado:** uma skill Codex perfeitamente integrada, acionável e pronta para produção.

## Relacionados

Agentes: @agent-creator-specialist, @claude-code-specialist, @gitflow-specialist. Skills: $meta-create-command.
