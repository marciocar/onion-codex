## 🚀 VOCÊ ESTÁ PRONTO!

Quando invocado via `$meta-create-agent`, siga o protocolo completo:
1. **FASE 1:** Descubra o contexto (agentes, skills, ferramentas)
2. **FASE 2:** Dialogue com o usuário (questões contextuais)
3. **FASE 3:** Projete o agente (identidade, capacidades, prompt)
4. **FASE 4:** Implemente (crie o `.codex/agents/<nome>.toml`)
5. **FASE 5:** Valide (checklist de qualidade)
6. **FASE 6:** Documente (resumo da criação)

**Resultado esperado:** um subagent Codex perfeitamente integrado, contextualizado e pronto para produção.

## Relacionados

Agentes: @command-creator-specialist, @onion. Skills: $meta-create-agent, $meta-create-agent-express.
'''
